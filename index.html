    @keyframes fadeIn {

    }
    @keyframes slideInBottom {
      from { transform: translateY(1rem); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideInTop {

      to { transform: translateY(0); opacity: 1; }

     Shuffle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.8.8 3.6 2.1l1.5 2.5"/><path d="M11 16.6l1.2 1.8c.8 1.3 2.1 2.1 3.6 2.1H22"/><path d="m18 14 4 4-4 4"/></svg>,
     Rotate: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>,
     Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
     X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
     Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>,
     Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
     Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
     Speech: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
     Laptop: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>,
     ArrowRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>,
     CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>,
     Alert: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
     Grid: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>,
     ChevronUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>,
     ChevronDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
     Clipboard: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14h6"/><path d="M9 10h6"/><path d="M9 18h6"/></svg>,
     Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    };

    // ==========================================
    // 2. FLASHCARDS COMPONENT
    // ==========================================

    function FlashcardsApp() {
     const [activeCategory, setActiveCategory] = useState('All');
     const [filteredCards, setFilteredCards] = useState(flashcardsData);
     const [currentIndex, setCurrentIndex] = useState(0);
     const [isFlipped, setIsFlipped] = useState(false);
     const [animating, setAnimating] = useState(false);

     const categories = ['All', 'FHA Specialist', 'USDA Rural Expert', 'Conventional Mastery'];

     useEffect(() => {
       setIsFlipped(false);
       setCurrentIndex(0);
       if (activeCategory === 'All') {
         setFilteredCards(flashcardsData);
       } else {
         setFilteredCards(flashcardsData.filter(c => c.category === activeCategory));
       }
     }, [activeCategory]);

     const handleNext = useCallback(() => {
       if (animating) return;
       setIsFlipped(false);
       setAnimating(true);
       setTimeout(() => {
         setCurrentIndex((prev) => (prev + 1) % filteredCards.length);
         setAnimating(false);
       }, 200);
     }, [filteredCards.length, animating]);

     const handlePrev = useCallback(() => {
       if (animating) return;
       setIsFlipped(false);
       setAnimating(true);
       setTimeout(() => {
         setCurrentIndex((prev) => (prev - 1 + filteredCards.length) % filteredCards.length);
         setAnimating(false);
       }, 200);
     }, [filteredCards.length, animating]);

     const toggleFlip = () => setIsFlipped(!isFlipped);

     const handleShuffle = () => {
       setIsFlipped(false);
       setAnimating(true);
       setTimeout(() => {
         const shuffled = [...filteredCards].sort(() => Math.random() - 0.5);
         setFilteredCards(shuffled);
         setCurrentIndex(0);
         setAnimating(false);
       }, 300);
     };

     useEffect(() => {
       const handleKeyDown = (e) => {
         if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
           e.preventDefault();
           toggleFlip();
         } else if (e.code === 'ArrowRight') {
           handleNext();
         } else if (e.code === 'ArrowLeft') {
           handlePrev();
         }
       };
       window.addEventListener('keydown', handleKeyDown);
       return () => window.removeEventListener('keydown', handleKeyDown);
     }, [handleNext, handlePrev, toggleFlip]);

     const currentCard = filteredCards[currentIndex];

     const getCategoryColor = (category) => {
       switch (category) {
         case 'FHA Specialist': return 'bg-blue-600';
         case 'USDA Rural Expert': return 'bg-green-600';
         case 'Conventional Mastery': return 'bg-purple-600';
         default: return 'bg-gray-600';
       }
     };

     return (
       <div className="flex flex-col items-center w-full animate-in fade-in duration-500">
         {/* Controls / Filter */}
         <div className="w-full max-w-3xl mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
           <div className="flex flex-wrap gap-2 justify-center">
             {categories.map((cat) => (
               <button
                 key={cat}
                 onClick={() => setActiveCategory(cat)}
                 className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                   activeCategory === cat
                     ? 'bg-indigo-600 text-white shadow-md'
                     : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                 }`}
               >
                 {cat}
               </button>
             ))}
           </div>
          
           <button
             onClick={handleShuffle}
             className="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
             title="Shuffle Cards"
           >
             <Icons.Shuffle /> Shuffle
           </button>
         </div>

         {/* Flashcard Area */}
         <div className="w-full max-w-2xl relative mb-8">
           <div className="flex justify-between text-xs font-semibold text-slate-400 mb-3 px-2 tracking-wider uppercase">
             <span>Card {currentIndex + 1} of {filteredCards.length}</span>
             <span>{currentCard?.category}</span>
           </div>

           <div
             className="relative w-full h-[350px] sm:h-[400px] cursor-pointer group"
             style={{ perspective: '1000px' }}
             onClick={toggleFlip}
           >
             <div
               className={`w-full h-full relative transition-transform duration-500 shadow-xl rounded-3xl ${animating ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}
               style={{
                 transformStyle: 'preserve-3d',
                 transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)'
               }}
             >
               {/* Front */}
               <div
                 className="absolute w-full h-full backface-hidden rounded-3xl border-2 border-slate-100 bg-white flex flex-col overflow-hidden"
                 style={{ backfaceVisibility: 'hidden' }}
               >
                 <div className={`h-2 w-full ${getCategoryColor(currentCard?.category)}`} />
                 <div className="flex-1 flex flex-col justify-center items-center p-8 text-center">
                   <span className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Question</span>
                   <h2 className="text-2xl sm:text-3xl font-bold text-slate-800 leading-snug">
                     {currentCard?.front}
                   </h2>
                 </div>
                 <div className="p-4 text-center text-slate-400 text-sm border-t border-slate-50 flex justify-center items-center gap-2">
                   <Icons.Rotate /> Click to reveal answer
                 </div>
               </div>

               {/* Back */}
               <div
                 className="absolute w-full h-full backface-hidden rounded-3xl border-2 border-indigo-100 bg-indigo-50 flex flex-col overflow-hidden"
                 style={{ backfaceVisibility: 'hidden', transform: 'rotateY(180deg)' }}
               >
                 <div className={`h-2 w-full ${getCategoryColor(currentCard?.category)}`} />
                 <div className="flex-1 flex flex-col justify-center items-center p-8 text-center">
                   <span className="text-sm font-bold text-indigo-400 uppercase tracking-widest mb-4">Answer</span>
                   <p className="text-xl sm:text-2xl font-medium text-indigo-900 leading-relaxed overflow-y-auto">
                     {currentCard?.back}
                   </p>
                 </div>
                 <div className="p-4 text-center text-indigo-400 text-sm border-t border-indigo-100 flex justify-center items-center gap-2">
                   <Icons.Rotate /> Click to see question
                 </div>
               </div>
             </div>
           </div>

           {/* Navigation Buttons */}
           <div className="flex justify-between items-center mt-8 gap-4">
             <button
               onClick={handlePrev}
               className="flex-1 flex justify-center items-center gap-2 py-4 rounded-xl bg-white text-slate-700 font-semibold shadow-sm border border-slate-200 hover:bg-slate-50 hover:border-slate-300 transition-all active:scale-95"
             >
               <Icons.ChevronLeft /> Previous
             </button>
             <button
               onClick={handleNext}
               className="flex-1 flex justify-center items-center gap-2 py-4 rounded-xl bg-indigo-600 text-white font-semibold shadow-md hover:bg-indigo-700 hover:shadow-lg transition-all active:scale-95"
             >
               Next <span className="rotate-180"><Icons.ChevronLeft /></span>
             </button>
           </div>
         </div>
       </div>
     );
    }

    // ==========================================
    // 3. QUIZ COMPONENT
    // ==========================================

    const shuffleArray = (array) => {
     const newArr = [...array];
     for (let i = newArr.length - 1; i > 0; i--) {
       const j = Math.floor(Math.random() * (i + 1));
       [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
     }
     return newArr;
    };

    function QuizApp() {
     const [questions, setQuestions] = useState([]);
     const [currentIndex, setCurrentIndex] = useState(0);
     const [selectedAnswer, setSelectedAnswer] = useState(null);
     const [score, setScore] = useState(0);
     const [isFinished, setIsFinished] = useState(false);

     const initializeQuiz = useCallback(() => {
       const processed = rawQuizData.map(item => {
         const allOptions = [item.a, ...item.d];
         return {
           questionText: item.q,
           correctAnswer: item.a,
           options: shuffleArray(allOptions)
         };
       });
       setQuestions(shuffleArray(processed));
       setCurrentIndex(0);
       setSelectedAnswer(null);
       setScore(0);
       setIsFinished(false);
     }, []);

     useEffect(() => { initializeQuiz(); }, [initializeQuiz]);

     const handleSelect = (option) => {
       if (selectedAnswer !== null) return;
       setSelectedAnswer(option);
       if (option === questions[currentIndex].correctAnswer) setScore(prev => prev + 1);
     };

     const handleNext = () => {
       if (currentIndex < questions.length - 1) {
         setCurrentIndex(prev => prev + 1);
         setSelectedAnswer(null);
       } else {
         setIsFinished(true);
       }
     };

     useEffect(() => {
       const handleKeyDown = (e) => {
         if (isFinished || questions.length === 0) return;
         const currentQ = questions[currentIndex];
        
         if (selectedAnswer === null) {
           if (e.key === '1' && currentQ.options[0]) handleSelect(currentQ.options[0]);
           if (e.key === '2' && currentQ.options[1]) handleSelect(currentQ.options[1]);
           if (e.key === '3' && currentQ.options[2]) handleSelect(currentQ.options[2]);
           if (e.key === '4' && currentQ.options[3]) handleSelect(currentQ.options[3]);
         }
         if (selectedAnswer !== null && (e.code === 'Enter' || e.code === 'Space')) {
           e.preventDefault();
           handleNext();
         }
       };
       window.addEventListener('keydown', handleKeyDown);
       return () => window.removeEventListener('keydown', handleKeyDown);
     }, [currentIndex, selectedAnswer, isFinished, questions]);

     if (questions.length === 0) return null;

     const currentQuestion = questions[currentIndex];
     const progressPercent = ((currentIndex) / questions.length) * 100;

     const getOptionStyle = (option) => {
       const isCorrect = option === currentQuestion.correctAnswer;
       const isSelected = option === selectedAnswer;

       if (selectedAnswer === null) return "bg-white border-slate-200 text-slate-700 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-900 shadow-sm";
       if (isSelected && isCorrect) return "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-md ring-1 ring-emerald-500";
       if (isSelected && !isCorrect) return "bg-rose-50 border-rose-500 text-rose-900 shadow-md ring-1 ring-rose-500";
       if (!isSelected && isCorrect) return "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
       return "bg-slate-50 border-slate-200 text-slate-400 opacity-60 cursor-not-allowed";
     };

     const getOptionIcon = (option) => {
       if (selectedAnswer === null) return null;
       if (option === currentQuestion.correctAnswer) return <div className="text-emerald-500 bg-emerald-100 p-1 rounded-full"><Icons.Check /></div>;
       if (option === selectedAnswer) return <div className="text-rose-500 bg-rose-100 p-1 rounded-full"><Icons.X /></div>;
       return null;
     };

     return (
       <div className="flex flex-col items-center w-full max-w-3xl animate-in fade-in duration-500">
         {!isFinished ? (
           <div className="w-full">
             <div className="flex justify-between items-end mb-3 px-2">
               <span className="text-sm font-bold text-slate-500 uppercase tracking-wider">
                 Question {currentIndex + 1} of {questions.length}
               </span>
               <div className="text-right">
                 <span className="text-xs text-slate-400 uppercase font-semibold mr-2">Score</span>
                 <span className="text-lg font-extrabold text-indigo-600 bg-indigo-100 px-3 py-1 rounded-lg">{score}</span>
               </div>
             </div>

             <div className="w-full h-2 bg-slate-200 rounded-full mb-6 overflow-hidden">
               <div className="h-full bg-indigo-500 transition-all duration-500 ease-out" style={{ width: `${progressPercent}%` }}></div>
             </div>

             <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden mb-8">
               <div className="p-8 sm:p-10 border-b border-slate-100 bg-slate-50/50">
                 <h2 className="text-2xl sm:text-3xl font-bold text-slate-800 leading-snug">{currentQuestion.questionText}</h2>
               </div>
               <div className="p-6 sm:p-8 flex flex-col gap-3">
                 {currentQuestion.options.map((option, idx) => (
                   <button
                     key={idx}
                     onClick={() => handleSelect(option)}
                     disabled={selectedAnswer !== null}
                     className={`flex items-center justify-between p-4 sm:p-5 rounded-2xl border-2 text-left text-lg font-medium transition-all duration-200 ${getOptionStyle(option)}`}
                   >
                     <div className="flex items-center gap-4">
                       <span className={`flex items-center justify-center w-8 h-8 rounded-lg text-sm font-bold transition-colors ${selectedAnswer === null ? 'bg-slate-100 text-slate-400 group-hover:bg-indigo-100 group-hover:text-indigo-600' : 'bg-transparent text-opacity-0'}`}>
                         {selectedAnswer === null ? idx + 1 : ''}
                       </span>
                       <span>{option}</span>
                     </div>
                     {getOptionIcon(option)}
                   </button>
                 ))}
               </div>
               <div className={`px-6 sm:px-8 pb-8 flex justify-end transition-opacity duration-300 ${selectedAnswer ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                 <button
                   onClick={handleNext}
                   className="flex items-center gap-2 px-8 py-4 rounded-xl bg-indigo-600 text-white font-bold text-lg shadow-md hover:bg-indigo-700 hover:shadow-lg transition-all active:scale-95"
                 >
                   {currentIndex === questions.length - 1 ? 'Finish Quiz' : 'Next Question'} <span className="rotate-180"><Icons.ChevronLeft /></span>
                 </button>
               </div>
             </div>
           </div>
         ) : (
           <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden p-10 text-center flex flex-col items-center w-full">
             <div className="w-24 h-24 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-6 shadow-inner">
               <Icons.Trophy />
             </div>
             <h2 className="text-3xl font-extrabold text-slate-900 mb-2">Quiz Complete!</h2>
             <p className="text-slate-500 mb-8">Let's see how you did on the NB Origination Process Quiz.</p>
            
             <div className="bg-slate-50 border border-slate-100 rounded-2xl p-8 w-full max-w-md mb-8">
               <div className="text-6xl font-black text-indigo-600 mb-2">
                 {Math.round((score / questions.length) * 100)}%
               </div>
               <div className="text-slate-600 font-medium text-lg">
                 You scored <strong className="text-slate-900">{score}</strong> out of <strong className="text-slate-900">{questions.length}</strong>
               </div>
             </div>

             <button
               onClick={initializeQuiz}
               className="flex items-center gap-2 px-8 py-4 rounded-xl bg-slate-900 text-white font-bold shadow-md hover:bg-slate-800 transition-all active:scale-95"
             >
               <Icons.Refresh /> Take Quiz Again
             </button>
           </div>
         )}
       </div>
     );
    }

    // ==========================================
    // 4. Action Script COMPONENT
    // ==========================================

    const ExpandContext = createContext(null);

    const GoalBadge = ({ text }) => (
     <div className="flex items-center gap-2 bg-amber-100 text-amber-800 px-4 py-3 rounded-xl font-bold text-sm tracking-wide shadow-sm mb-6 border border-amber-200">
       <Icons.Target /> <span>GOAL: {text}</span>
     </div>
    );

    const ScriptBox = ({ title, text, list, defaultExpanded = true }) => {
     const [expanded, setExpanded] = useState(defaultExpanded);
     const expandCtx = useContext(ExpandContext);

     useEffect(() => {
       if (expandCtx && expandCtx.signal > 0) {
         setExpanded(expandCtx.isAllExpanded);
       }
     }, [expandCtx]);

      return (
       <div className="relative bg-blue-50 border-l-4 border-blue-500 rounded-r-xl p-5 mb-4 shadow-sm group hover:shadow-md transition-all">
         <div
           className="flex justify-between items-center cursor-pointer select-none"
           onClick={() => setExpanded(!expanded)}
         >
           <h4 className="text-xs font-black uppercase text-blue-600 tracking-wider flex items-center gap-2">
             <Icons.Speech /> Script: {title}
           </h4>
           <div className="text-blue-400 group-hover:text-blue-600 transition-colors">
             {expanded ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
           </div>
         </div>
        
         <div className={`transition-all duration-300 overflow-hidden ${expanded ? 'max-h-[2000px] opacity-100 mt-3' : 'max-h-0 opacity-0'}`}>
           {text && <p className="text-blue-900 text-lg font-serif leading-relaxed italic whitespace-pre-wrap">"{text}"</p>}
           {list && (
             <ul className="mt-3 space-y-2">
               {list.map((item, i) => (
                 <li key={i} className="flex items-start gap-2 text-blue-900 text-[15px] font-serif italic">
                   <span className="text-blue-400 mt-1"><Icons.CheckCircle /></span><span>{item}</span>
                 </li>
               ))}
             </ul>
           )}
         </div>
       </div>
     );
    };

    const ActionBox = ({ title, text, bulletPoints }) => (
     <div className="relative bg-slate-800 border-l-4 border-emerald-500 rounded-r-xl p-5 mb-4 shadow-sm">
       <div className="absolute top-0 right-0 p-3 text-slate-600"><Icons.Laptop /></div>

      {q:"Because Chloe has rented this home for 4 years, what exception does she qualify for?", o:["A) She can use a 0% down USDA option instead.", "B) She is exempt from the 15% down payment requirement for Identity of Interest.", "C) She can waive the FHA appraisal requirement.", "D) She can omit her current rent from the VOR address history."], a:1, e:"Identity of Interest transactions normally require 15% down, but an exception applies if the tenant has rented the property for at least 6 months."},

     {t:"Scenario 3: The High-DTI Teacher (FHA)", b:"Elena is a teacher making $5,200/month in base salary. Her AUS (DU) returned a \"Refer\" finding due to recent credit issues. She has a 635 FICO, an old credit card collection of $2,100, and a deferred student loan with a $50,000 balance. She has $8,000 in a liquid savings account and has been at the same school for 5 years.", qs:[

      {q:"How should the deferred student loan payment be calculated for her DTI?", o:["A) $0 because it is in a documented deferment period.", "B) 1% of the balance ($500).", "C) 0.5% of the balance ($250).", "D) The payment listed on her last IBR statement."], a:2, e:"When an FHA student loan has a $0 reported payment, you must calculate the monthly obligation as 0.5% of the outstanding balance."},
      {q:"Because her AUS result is \"Refer,\" what is her maximum back-end DTI without comp factors?", o:["A) 41%", "B) 43%", "C) 45%", "D) 50%"], a:1, e:"Under Manual Underwriting, the maximum back-end DTI without any compensating factors is typically capped at 43%."},
      {q:"Under Manual Underwriting (MUW), which item from her profile is a valid \"Compensating Factor\"?", o:["A) Having only one source of income.", "B) 5 years of continuous employment with the same employer.", "C) Using a gift fund for the down payment.", "D) Her 635 FICO score."], a:1, e:"Continuous employment with the same primary employer for 5 or more years is an acceptable compensating factor for manual underwriting."}

     {t:"Scenario 4: The Seasonal Foreman (FHA)", b:"Frank (50) is a landscape foreman in Missouri. He works 9 months a year making $6,000/month and draws unemployment for the other 3 months ($1,200/month). He has done this for 6 years and provides W2s. His mid-FICO is 625. He is looking at a $150,000 home that was built in 1975 and has some visible chipping paint.", qs:[

     {t:"Scenario 5: The \"Gift Fund\" Graduate (FHA)", b:"Recent college grad Maya is buying her first home for $175,000. She has $1,500 in personal savings. Her grandmother is providing a $10,000 gift for the down payment and closing costs. Maya's student loans are currently in a grace period ($0 payment) and her credit score is 680. She is currently renting an apartment for $900/month.", qs:[

     {t:"Scenario 6: The Multi-Adult Household (USDA)", b:"Penny (43) is a preschool teacher making $30/hr ($5,200/mo) and has worked there for 4 years. She lives with her two children and her live-in boyfriend, John, who makes $35,000/yr as a tire technician. Penny wants the USDA loan in her name only for a house in a rural county where the income cap is $119,850.", qs:[

     {t:"Scenario 8: The High-Asset Applicant (USDA)", b:"Dr. Aris earns $110,000/yr as a general practitioner. He has $180,000 sitting in a liquid checking account and a 780 FICO score. He wants a USDA loan specifically because he wants a 0% down option to \"keep his cash for the stock market\". He is looking at a home in a qualifying rural area.", qs:[

     {t:"Scenario 12: HomeReady Logistics (Conventional)", b:"James makes $58,000/yr. The Area Median Income (AMI) for his target home is $70,000. James has a 690 score and wants the lowest interest rate pricing possible. He has not owned a home in over 5 years. He has $10,000 in a 401k he wants to use as reserves.", qs:[

    function ScenariosApp() {
      const [sIdx, setSIdx] = useState(0);
      const [qIdx, setQIdx] = useState(0);
      const [sel, setSel] = useState(null);
      const [score, setScore] = useState(0);
      const [finished, setFinished] = useState(false);
      const [time, setTime] = useState(0);

      const scenario = sd[sIdx];
      const question = scenario?.qs[qIdx];

      useEffect(() => {
        let interval;
        if (!finished) {
          interval = setInterval(() => {
            setTime(t => t + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [finished]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const handleSelect = (idx) => {
        if(sel !== null) return;
        setSel(idx);
        if(idx === question.a) setScore(s => s + 1);
      };

      const handleNext = () => {
        if(qIdx < 3) {
          setQIdx(q => q + 1);
        } else {
          if(sIdx < sd.length - 1) {
            setSIdx(s => s + 1);
            setQIdx(0);
          } else {
            setFinished(true);
          }
        }
        setSel(null);
      };

      const restart = () => {
        setSIdx(0); setQIdx(0); setSel(null); setScore(0); setTime(0); setFinished(false);
      };

      if (finished) {
        return (
          <div className="flex flex-col items-center w-full max-w-3xl animate-in fade-in duration-500">
            <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden p-10 text-center flex flex-col items-center w-full">
               <div className="w-24 h-24 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mb-6 shadow-inner">
                 <Icons.Clipboard />
               </div>
               <h2 className="text-3xl font-extrabold text-slate-900 mb-2">Scenarios Complete!</h2>
               <p className="text-slate-500 mb-8">You have completed all 15 scenarios.</p>
              
               <div className="bg-slate-50 border border-slate-100 rounded-2xl p-8 w-full max-w-md mb-8 flex justify-between items-center">
                 <div className="text-center w-1/2 border-r border-slate-200">
                   <div className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Final Score</div>
                   <div className="text-5xl font-black text-pink-600 mb-1">{Math.round((score / 60) * 100)}%</div>
                   <div className="text-slate-600 font-medium text-sm">{score} / 60 Correct</div>
                 </div>
                 <div className="text-center w-1/2">
                   <div className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Total Time</div>
                   <div className="text-4xl font-black text-slate-700 mb-1">{formatTime(time)}</div>
                 </div>
               </div>

               <button onClick={restart} className="flex items-center gap-2 px-8 py-4 rounded-xl bg-slate-900 text-white font-bold shadow-md hover:bg-slate-800 transition-all active:scale-95">
                 <Icons.Refresh /> Restart Scenarios
               </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col items-center w-full max-w-4xl animate-in fade-in duration-500">
          
          <div className="w-full flex justify-between items-end mb-3 px-2">
             <span className="text-sm font-bold text-slate-500 uppercase tracking-wider">
               Scenario {sIdx + 1} of {sd.length}
             </span>
             <div className="flex items-center gap-4 text-right">
               <div className="flex items-center gap-1.5 text-slate-500 font-bold bg-slate-200 px-3 py-1 rounded-lg">
                 <Icons.Clock /> {formatTime(time)}
               </div>
               <div>
                 <span className="text-xs text-slate-400 uppercase font-semibold mr-2">Score</span>
                 <span className="text-lg font-extrabold text-pink-600 bg-pink-100 px-3 py-1 rounded-lg">{score}</span>
               </div>
             </div>
          </div>
          <div className="w-full h-2 bg-slate-200 rounded-full mb-6 overflow-hidden">
             <div className="h-full bg-pink-500 transition-all duration-500 ease-out" style={{ width: `${(sIdx / sd.length) * 100}%` }}></div>
          </div>

          <div className="w-full bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden mb-8">
            <div className="bg-slate-800 text-white p-6 sm:p-8">
              <h2 className="text-xl sm:text-2xl font-bold mb-4 text-emerald-400 flex items-center gap-2">
                <Icons.Book /> {scenario.t}
              </h2>
              <p className="text-slate-200 text-base leading-relaxed font-medium">
                {scenario.b}
              </p>
            </div>
            
            <div className="p-6 sm:p-8 border-t-4 border-pink-500 bg-slate-50">
              <div className="text-sm font-bold text-pink-500 uppercase tracking-widest mb-3">
                Question {qIdx + 1} of 4
              </div>
              <h3 className="text-xl sm:text-2xl font-bold text-slate-800 leading-snug mb-6">
                {question.q}
              </h3>
              
              <div className="flex flex-col gap-3">
                {question.o.map((opt, i) => {
                  const isSelected = sel === i;
                  const isCorrect = i === question.a;
                  
                  let style = "bg-white border-slate-200 text-slate-700 hover:bg-pink-50 hover:border-pink-200 hover:text-pink-900 shadow-sm";
                  let icon = null;

                  if (sel !== null) {
                    if (isSelected && isCorrect) {
                      style = "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-md ring-1 ring-emerald-500";
                      icon = <div className="text-emerald-500 bg-emerald-100 p-1 rounded-full"><Icons.CheckCircle /></div>;
                    } else if (isSelected && !isCorrect) {
                      style = "bg-rose-50 border-rose-500 text-rose-900 shadow-md ring-1 ring-rose-500";
                      icon = <div className="text-rose-500 bg-rose-100 p-1 rounded-full"><Icons.X /></div>;
                    } else if (!isSelected && isCorrect) {
                      style = "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                    } else {
                      style = "bg-slate-50 border-slate-200 text-slate-400 opacity-60 cursor-not-allowed";
                    }
                  }

                  return (
                    <button key={i} onClick={() => handleSelect(i)} disabled={sel !== null} className={`flex items-center justify-between p-4 sm:p-5 rounded-2xl border-2 text-left text-lg font-medium transition-all duration-200 ${style}`}>
                       <div className="flex items-center gap-4">
                         <span className={`flex items-center justify-center w-8 h-8 rounded-lg text-sm font-bold transition-colors ${sel === null ? 'bg-slate-100 text-slate-400' : 'bg-transparent text-opacity-0'}`}>
                           {sel === null ? String.fromCharCode(65 + i) : ''}
                         </span>
                         <span>{opt}</span>
                       </div>
                       {icon}
                    </button>
                  );
                })}
              </div>
              
              {/* Dynamic Explanation Box */}
              {sel !== null && (
                <div className={`mt-6 p-5 rounded-xl border-l-4 animate-in fade-in slide-in-from-top-2 ${sel === question.a ? 'bg-emerald-50 border-emerald-500' : 'bg-rose-50 border-rose-500'}`}>
                   <h4 className={`font-bold mb-1 flex items-center gap-2 ${sel === question.a ? 'text-emerald-800' : 'text-rose-800'}`}>
                      {sel === question.a ? <Icons.CheckCircle /> : <Icons.X />}
                      {sel === question.a ? 'Correct!' : 'Incorrect!'}
                   </h4>
                   <p className={sel === question.a ? 'text-emerald-700 font-medium' : 'text-rose-700 font-medium'}>
                      {question.e}
                   </p>
                </div>
              )}

              <div className={`mt-8 flex justify-end transition-opacity duration-300 ${sel !== null ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                 <button onClick={handleNext} className="flex items-center gap-2 px-8 py-4 rounded-xl bg-pink-600 text-white font-bold text-lg shadow-md hover:bg-pink-700 hover:shadow-lg transition-all active:scale-95">
                   {qIdx === 3 ? (sIdx === sd.length - 1 ? 'Finish Scenarios' : 'Next Scenario') : 'Next Question'} <Icons.ArrowRight />
                 </button>
              </div>

            </div>
          </div>

        </div>
      );
    }

    // ==========================================
    // 7. MAIN PORTAL (ROUTER / LAYOUT)
    // ==========================================

    function App() {
     const [currentView, setCurrentView] = useState('home');

     const navItems = [
       { id: 'flashcards', label: 'Flashcards', icon: <Icons.Rotate />, color: 'text-blue-600', bg: 'bg-blue-100' },
       { id: 'quiz', label: 'Process Quiz', icon: <Icons.Trophy />, color: 'text-indigo-600', bg: 'bg-indigo-100' },
       { id: 'battlecard', label: 'Action Script', icon: <Icons.Target />, color: 'text-emerald-600', bg: 'bg-emerald-100' },
       { id: 'productcards', label: 'Reference Cards', icon: <Icons.Book />, color: 'text-amber-600', bg: 'bg-amber-100' },
       { id: 'scenarios', label: 'Scenarios', icon: <Icons.Clipboard />, color: 'text-pink-600', bg: 'bg-pink-100' },
     ];

     const renderView = () => {
       switch (currentView) {
         case 'flashcards': return <FlashcardsApp />;
         case 'quiz': return <QuizApp />;
         case 'battlecard': return <BattleCardApp />;
         case 'productcards': return <ProductCardsApp />;
         case 'scenarios': return <ScenariosApp />;
         default: return (
           <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl animate-in fade-in duration-500">
             <button onClick={() => setCurrentView('flashcards')} className="flex flex-col items-center p-8 bg-white rounded-3xl shadow-md border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition-all group text-center">
               <div className="w-20 h-20 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mb-6 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                 <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
               </div>
               <h2 className="text-2xl font-bold text-slate-800 mb-2">Mortgage Flashcards</h2>
               <p className="text-slate-500">Master FHA, USDA, and Conventional guidelines with interactive study cards.</p>
             </button>

             <button onClick={() => setCurrentView('quiz')} className="flex flex-col items-center p-8 bg-white rounded-3xl shadow-md border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition-all group text-center">
               <div className="w-20 h-20 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                 <Icons.Trophy />
               </div>
               <h2 className="text-2xl font-bold text-slate-800 mb-2">Process Quiz</h2>
               <p className="text-slate-500">Test your knowledge on Encompass navigation, tools, and origination flows.</p>
             </button>

             <button onClick={() => setCurrentView('battlecard')} className="flex flex-col items-center p-8 bg-white rounded-3xl shadow-md border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition-all group text-center">
               <div className="w-20 h-20 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-6 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                 <Icons.Target />
               </div>
               <h2 className="text-2xl font-bold text-slate-800 mb-2">Live Action Script</h2>
               <p className="text-slate-500">Quick-reference dashboard integrating call scripts and essential system actions.</p>
             </button>

             <button onClick={() => setCurrentView('productcards')} className="flex flex-col items-center p-8 bg-white rounded-3xl shadow-md border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition-all group text-center">
               <div className="w-20 h-20 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mb-6 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                 <Icons.Book />
               </div>
               <h2 className="text-2xl font-bold text-slate-800 mb-2">Reference Cards</h2>
               <p className="text-slate-500">Quick-reference guides highlighting rules for FHA, USDA, Conventional, and Global Systems.</p>
             </button>

             <button onClick={() => setCurrentView('scenarios')} className="flex flex-col items-center p-8 bg-white rounded-3xl shadow-md border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition-all group text-center lg:col-span-2">
               <div className="w-20 h-20 rounded-2xl bg-pink-50 text-pink-600 flex items-center justify-center mb-6 group-hover:bg-pink-600 group-hover:text-white transition-colors">
                 <Icons.Clipboard />
               </div>
               <h2 className="text-2xl font-bold text-slate-800 mb-2">Scenarios</h2>
               <p className="text-slate-500">Test your problem-solving skills across 15 real-world borrowing scenarios with interactive Q&A.</p>
             </button>
           </div>
         );
       }
     };

     return (
       <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
         {/* Top Navigation Bar */}
         <nav className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm overflow-x-auto">
           <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-w-max">
             <div className="flex justify-between h-16 items-center">
               <div className="flex mr-8">
                 <button
                   onClick={() => setCurrentView('home')}
                   className="flex items-center gap-2 flex-shrink-0 font-extrabold text-xl tracking-tight text-slate-900 hover:text-indigo-600 transition-colors"
                 >
                   <div className="p-1.5 bg-indigo-600 text-white rounded-lg"><Icons.Grid /></div>
                   NB Training Hub
                 </button>
               </div>
               <div className="flex space-x-2 items-center">
                 {navItems.map(item => (
                   <button
                     key={item.id}
                     onClick={() => setCurrentView(item.id)}
                     className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all ${
                       currentView === item.id
                         ? `${item.bg} ${item.color}`
                         : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'
                     }`}
                   >
                     <span className="w-4 h-4">{item.icon}</span> <span className="hidden lg:inline">{item.label}</span>
                   </button>
                 ))}
               </div>
             </div>
           </div>
         </nav>

         {/* Main Content Area */}
         <main className="flex-1 w-full max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8 flex flex-col items-center">
           {/* Dynamic Header based on View */}
           {currentView !== 'home' && (
             <div className="w-full text-center mb-8 animate-in slide-in-from-top-2">
               <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">
                 {currentView === 'flashcards' && 'Mortgage Flashcards'}
                 {currentView === 'quiz' && 'NB Origination Process Quiz'}
                 {currentView === 'battlecard' && 'Origination Action Script'}
                 {currentView === 'productcards' && 'Reference Cards'}
                 {currentView === 'scenarios' && 'Mastery Scenarios'}
               </h1>
               <p className="text-slate-500 mt-2 font-medium">
                 {currentView === 'flashcards' && 'Master FHA, USDA, and Conventional guidelines.'}
                 {currentView === 'quiz' && 'Test your knowledge of the platform and processes.'}
                 {currentView === 'battlecard' && 'Process Flow & Script Integration Dashboard.'}
                 {currentView === 'productcards' && 'Quick-reference guidelines for loan products and systems.'}
                 {currentView === 'scenarios' && 'Apply your knowledge to real-world borrowing situations.'}
               </p>
             </div>
           )}

           {/* View Header for Home */}
           {currentView === 'home' && (
             <div className="text-center max-w-2xl mb-12 mt-4 animate-in slide-in-from-bottom-4">
               <h1 className="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
                 Origination Mastery Portal
               </h1>
               <p className="text-lg text-slate-500 leading-relaxed">
                 Welcome to the centralized training hub. Select a tool below to practice guidelines, test your system knowledge, or navigate live borrower calls.
               </p>
             </div>
           )}

           {/* Rendered Tool */}
           {renderView()}
         </main>
       </div>
     );
    }

    // Standard React 18 mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
